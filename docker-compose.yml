x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    BRONZE_INGESTION_MODE: ${BRONZE_INGESTION_MODE:-file}
    OPENFEC_API_KEY: ${OPENFEC_API_KEY:-}
    OPENFEC_CYCLE: ${OPENFEC_CYCLE:-2026}
    OPENFEC_STATE: ${OPENFEC_STATE:-}
    OPENFEC_PAGES: ${OPENFEC_PAGES:-1}
    OPENFEC_PER_PAGE: ${OPENFEC_PER_PAGE:-100}
    STATE_CSV_URL: ${STATE_CSV_URL:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./src:/opt/project/src
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --firstname Air \
          --lastname Flow \
          --role Admin \
          --email airflow@example.com \
          --password airflow || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENFEC_API_KEY: ${OPENFEC_API_KEY:-}
      STATE_CSV_URL: ${STATE_CSV_URL:-}
    command:
      - /bin/sh
      - -c
      - >
        python scripts/run_pipeline.py
        --stage all
        --ingestion-mode ${BRONZE_INGESTION_MODE:-file}
        --openfec-cycle ${OPENFEC_CYCLE:-2026}
        --openfec-pages ${OPENFEC_PAGES:-1}
        --openfec-per-page ${OPENFEC_PER_PAGE:-100}
        $${OPENFEC_STATE:+--openfec-state $$OPENFEC_STATE}
        $${STATE_CSV_URL:+--state-csv-url $$STATE_CSV_URL}
    volumes:
      - ./data:/app/data
    profiles:
      - pipeline

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    profiles:
      - dashboard

  dbt:
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    working_dir: /usr/app/dbt
    command: ["parse"]
    volumes:
      - ./dbt:/usr/app/dbt
      - ./data:/usr/app/data
      - ./docker/dbt/profiles.yml:/root/.dbt/profiles.yml:ro
    profiles:
      - dbt

volumes:
  airflow-postgres:
